name: Switch Pages to gh-pages

on:
  push:
    branches: [docs/m01-validation-readiness-audit]
    paths: [.github/workflows/switch-pages-to-gh-pages.yml]

permissions:
  contents: read
  pages: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages publishing source to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o /tmp/pages-response.txt -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          cat /tmp/pages-response.txt || true
          echo "HTTP ${code}"
          test "${code}" = '204'
