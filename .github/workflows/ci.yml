name: Prototype CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in app.js course-data.js learning-domain.js m01-validation-data.js m01-validation-app.js; do
            node --check "$file"
          done
      - name: Run tests
        run: node --test tests/*.test.js
